<h3>Aufträge</h3>

<form class="form-inline">
    <label>Status:</label>
    <select class="form-control" ng-model="statusFilter" ng-change="laden()">
        <option value="">Alle</option>
        <option ng-repeat="s in statusListe" value="{{s}}">{{s}}</option>
    </select>
</form>
<br />

<table class="table table-striped table-condensed">
    <thead>
        <tr><th>Nr.</th><th>Datum</th><th>Kunde</th><th>Beschreibung</th><th>Techniker</th><th>Status</th><th class="text-right">Summe</th></tr>
    </thead>
    <tbody>
        <tr ng-repeat="a in auftraege">
            <td><a href="#/auftraege/{{a.AuftragsNr}}">{{a.AuftragsNr}}</a></td>
            <td>{{a.Datum | date:'dd.MM.yyyy'}}</td>
            <td><a href="#/kunden/{{a.KdNr}}">{{a.Kundenname}}</a></td>
            <td>{{a.Beschreibung}}</td>
            <td>{{a.Techniker}}</td>
            <td><span class="label status-{{a.Status}}">{{a.Status}}</span></td>
            <td class="text-right">{{a.Summe | number:2}} €</td>
        </tr>
    </tbody>
</table>
