name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  legacy:
    name: Legacy-Build (.NET Framework 4.8)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - uses: NuGet/setup-nuget@v2
      - run: nuget restore legacy/Auftragsverwaltung.sln
      - run: msbuild legacy/Auftragsverwaltung.sln /p:Configuration=Release /m /v:minimal

  backend:
    runs-on: ubuntu-latest
    if: hashFiles('modern/**/*.sln', 'modern/**/*.slnx') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore modern
      - run: dotnet build modern --no-restore -c Release
      - run: dotnet test modern --no-build -c Release
      - run: dotnet list modern package --vulnerable --include-transitive

  frontend:
    runs-on: ubuntu-latest
    if: hashFiles('modern/web/package.json') != ''
    defaults:
      run:
        working-directory: modern/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npm test -- --watch=false
      - run: npm audit --audit-level=high
