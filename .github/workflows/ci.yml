name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  legacy:
    name: Legacy-Build (.NET Framework 4.8)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - uses: NuGet/setup-nuget@v2
      - run: nuget restore legacy/Auftragsverwaltung.sln
      - run: msbuild legacy/Auftragsverwaltung.sln /p:Configuration=Release /m /v:minimal

  modern:
    name: Modern (.NET 10) mit Charakterisierungs- und Sicherheitstests
    runs-on: ubuntu-latest
    env:
      # Nur für den kurzlebigen Test-Container in der CI, kein echtes Secret
      SA_PASSWORD: CiOnly_Test123!
      DOTNET_NOLOGO: 1
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: CiOnly_Test123!
        ports:
          - 1433:1433
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build modern/Auftragsverwaltung.slnx -c Release

      - name: Domain-Tests
        run: dotnet test modern/tests/Auftragsverwaltung.Domain.Tests -c Release --no-build

      - name: Datenbank aus Legacy-Skripten anlegen, moderne Schemaänderungen anwenden
        run: |
          SQL=${{ job.services.sql.id }}
          SQLCMD="/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P $SA_PASSWORD -b"
          for i in $(seq 1 30); do docker exec $SQL $SQLCMD -Q "SELECT 1" > /dev/null 2>&1 && break; sleep 2; done
          for f in legacy/Datenbank/*.sql modern/Datenbank/*.sql; do
            docker cp "$f" $SQL:/tmp/skript.sql
            docker exec $SQL $SQLCMD -f 65001 -i /tmp/skript.sql
          done

      - name: Moderne API starten (5080 wie Legacy, 5081 mit Anmeldepflicht)
        env:
          ConnectionStrings__AvDb: Server=localhost,1433;Database=Auftragsverwaltung;User ID=sa;Password=${{ env.SA_PASSWORD }};TrustServerCertificate=True
        run: |
          API=modern/src/Auftragsverwaltung.Api/bin/Release/net10.0/Auftragsverwaltung.Api.dll
          dotnet $API --urls http://localhost:5080 > api.log 2>&1 &
          Sicherheit__AnmeldungErforderlich=true Sicherheit__SchluesselPfad=/tmp/av-schluessel \
            dotnet $API --urls http://localhost:5081 > api-sicher.log 2>&1 &
          for port in 5080 5081; do
            for i in $(seq 1 30); do curl -sf http://localhost:$port/health > /dev/null && break; sleep 1; done
            curl -sf http://localhost:$port/health > /dev/null || { cat api.log api-sicher.log; exit 1; }
          done

      - name: Charakterisierungstests gegen die moderne API
        env:
          AV_BASE_URL: http://localhost:5080/
        run: dotnet test modern/tests/Auftragsverwaltung.Charakterisierung -c Release --no-build --logger "console;verbosity=normal"

      - name: Sicherheitstests (ADR 0003) gegen die API mit Anmeldepflicht
        env:
          AV_SICHERHEIT_URL: http://localhost:5081/
        run: dotnet test modern/tests/Auftragsverwaltung.Sicherheitstests -c Release --no-build --logger "console;verbosity=normal"

      - name: Proxy mit Anmeldepflicht vor API und Legacy-Attrappe starten
        run: |
          python3 -m http.server 5090 --directory modern/tests/Auftragsverwaltung.Sicherheitstests/LegacyAttrappe > attrappe.log 2>&1 &
          Sicherheit__AnmeldungErforderlich=true \
          Sicherheit__SchluesselPfad=/tmp/av-schluessel \
          ReverseProxy__Clusters__modern__Destinations__api__Address=http://localhost:5081/ \
          ReverseProxy__Clusters__legacy__Destinations__iis__Address=http://localhost:5090/ \
            dotnet modern/src/Auftragsverwaltung.Proxy/bin/Release/net10.0/Auftragsverwaltung.Proxy.dll \
              --contentRoot modern/src/Auftragsverwaltung.Proxy/bin/Release/net10.0 --urls http://localhost:5082 > proxy.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:5082/index.html > /dev/null && exit 0; sleep 1; done
          cat proxy.log attrappe.log; exit 1

      - name: Proxy-Tests (Legacy-Routen geschützt)
        env:
          AV_PROXY_URL: http://localhost:5082/
        run: dotnet test modern/tests/Auftragsverwaltung.Sicherheitstests -c Release --no-build --logger "console;verbosity=normal"

      - name: Prüfen, dass angemeldete Benutzer keine Klartextpasswörter mehr haben
        run: |
          docker exec ${{ job.services.sql.id }} /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P $SA_PASSWORD -b -d Auftragsverwaltung -Q "
            SELECT Login, CASE WHEN PasswortHash IS NULL THEN 'Klartext' ELSE 'Hash' END AS Verfahren FROM tblBenutzer;
            IF EXISTS (SELECT 1 FROM tblBenutzer WHERE Login IN ('admin','sabine') AND (PasswortHash IS NULL OR Passwort <> ''))
              RAISERROR('Klartextpasswort nach Login noch vorhanden', 16, 1);"

      - name: API-Logs bei Fehler
        if: failure()
        run: cat api.log api-sicher.log proxy.log || true

      - name: Abhängigkeiten auf Sicherheitslücken prüfen
        run: dotnet list modern/Auftragsverwaltung.slnx package --vulnerable --include-transitive
